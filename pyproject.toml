[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "am-i-nerfed"
version = "0.2.0"
description = "降智测试 · Trace observable model routing in Claude Code and Codex subscriptions."
readme = "README.en.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mushan Yang"}]
keywords = ["claude-code", "codex", "model-routing", "llm", "observability", "am-i-nerfed"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
am-i-nerfed = "am_i_nerfed.cli:main"

[project.urls]
Homepage = "https://github.com/mushanyoung/am-i-nerfed"
Issues = "https://github.com/mushanyoung/am-i-nerfed/issues"
Source = "https://github.com/mushanyoung/am-i-nerfed"

[tool.setuptools.packages.find]
where = ["src"]
